<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
  <p-confirmDialog></p-confirmDialog>
  <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
    <h2 class="text-xl font-semibold text-gray-800">Courses</h2>
    <button
      (click)="openCourseForm()"
      class="px-4 py-2 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 transition"
    >
      Add Course
    </button>
  </div>

  <div class="p-4">
    <p-table
      class="h-72 flex! flex-col!"
      [loading]="allCoursesResource.isLoading()"
      scrollHeight="350px"
      [value]="allCoursesResource.value() || []"
      [tableStyle]="{ 'min-width': '50rem' }"
      [paginator]="true"
      [rows]="5"
    >
      <ng-template #caption>
        <div class="flex">
          <p-iconfield class="ml-auto">
            <input
              pInputText
              type="text"
              [formControl]="searchControl"
              placeholder="Search keyword"
            />
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
          </p-iconfield>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Instructor</th>
          <th>Duration</th>
          <th>Price</th>
          <th>Created Date</th>
          <th pSortableColumn="status">
            Status
            <p-sortIcon field="status" />
          </th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-course>
        <tr>
          <td class="font-medium text-gray-900">{{ course.courseName }}</td>
          <td class="text-gray-600">{{ course.category }}</td>
          <td class="text-gray-600">{{ course.instructorName }}</td>
          <td class="text-gray-600">{{ course.duration }}h</td>
          <td class="text-gray-600">{{ course.price | currency }}</td>
          <td class="text-gray-600">{{ course.createdDate | date: 'mediumDate' }}</td>
          <td>
            <span
              class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
              [ngClass]="{
                'bg-green-100 text-green-800': course.status === 'Active',
                'bg-yellow-100 text-yellow-800': course.status === 'Draft',
                'bg-gray-100 text-gray-800': course.status === 'Archived',
              }"
            >
              {{ course.status }}
            </span>
          </td>
          <td>
            <div class="flex gap-2">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                severity="info"
                [routerLink]="['/details', course.id]"
                tooltipPosition="top"
                pTooltip="View Details"
              ></p-button>
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                severity="success"
                (onClick)="openCourseForm(course)"
                pTooltip="Edit"
                tooltipPosition="top"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                (onClick)="confirmDelete(course.id)"
                tooltipPosition="top"
                pTooltip="Delete"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="text-center! p-4 text-gray-500">No courses found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
