<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CourseManagementDashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <style id="splash-styles">
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      z-index: 9999;

      img {
        width: 12rem;
        animation: fadeIn 3s ease-in-out infinite;
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 0.6;
        transform: scale(1);
      }
    }
  </style>
  <body>
    <section id="splash-screen">
      <img src="/images/auth.png" alt="logo" />
    </section>
    <app-root></app-root>
  </body>
</html>
